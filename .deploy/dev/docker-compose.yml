name: warehouse-dev

volumes:
  redis_data:

services:
  warehouse-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    # Internal-only: just service in warehouse-net, cannot open host
    expose:
      - "6379"
    networks:
      - warehouse-net
    restart: unless-stopped

  warehouse-api:
    image: ghcr.io/homeslands/warehouse-api:dev
    restart: unless-stopped
    depends_on:
      warehouse-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8085/api/${VERSION:-v1.0.0}/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s # Give more time for MySQL to become ready
    environment:
      # General
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      VERSION: ${VERSION}

      # Database
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}

      # Token
      SALT_ROUNDS: ${SALT_ROUNDS}
      DURATION: ${DURATION}
      REFRESHABLE_DURATION: ${REFRESHABLE_DURATION}

      # ACB Banking
      ACB_CLIENT_ID: ${ACB_CLIENT_ID}
      ACB_CLIENT_SECRET: ${ACB_CLIENT_SECRET}

      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Redis queue
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Otel lgtm
      OTEL_LGTM_URL: ${OTEL_LGTM_URL}

      # Session
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}

      # ZaloOA
      ZALO_OA_API_KEY: ${ZALO_OA_API_KEY}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY}
      ZALO_OA_ID: ${ZALO_OA_ID}

      # Google Maps
      GOOGLE_MAP_API_URL: ${GOOGLE_MAP_API_URL}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CARD_ORDER_PAYMENT_TIMEOUT: ${CARD_ORDER_PAYMENT_TIMEOUT}

      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}

      # AWS
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}

      #Proxy
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT}

      #QR payment point
      QR_TOKEN_TTL: ${QR_TOKEN_TTL}
      QR_ACTIVE_TTL: ${QR_ACTIVE_TTL}
      QR_IDEMPOTENT_TTL: ${QR_IDEMPOTENT_TTL}

      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8085:8085"
    networks:
      - warehouse-net # internal call with redis
      - scoobydoo # nginx-proxy-manager route without publish port
    # deploy:
    #   replicas: 2
    #   update_config:
    #     parallelism: 1
    #     delay: 10s
    #   restart_policy:
    #     condition: on-failure


  warehouse-ui:
    image: ghcr.io/homeslands/warehouse-ui:dev
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5175"] # TCP check on port 5175
      interval: 10s # Increase interval between health checks
      timeout: 10s # Increase timeout for slower responses
      retries: 5
    restart: unless-stopped
    ports:
      - "5175:5175"
    networks:
      - warehouse-net
      - scoobydoo

  # warehouse-postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   expose:
  #     - "5432"
  #   networks:
  #     - warehouse-net
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # roboflow:
  #   image: tuanvux01/roboflow:dev
  #   restart: unless-stopped
  #   ports:
  #     - 8082:8080
  #   environment:
  #     - ENV=development
  #     - PORT=8080
  #     - POSTGRES_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
  #   depends_on:
  #     - postgres

networks:
  # Network nội bộ của stack dev, do compose tự tạo/quản lý
  warehouse-net:
    name: warehouse-dev-net
    driver: bridge
  scoobydoo:
    external: true
    name: scoobydoo
