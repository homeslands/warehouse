name: build-and-test

on:
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FE dependencies
        working-directory: ./app/warehouse-ui
        run: npm install

      - name: Build FE
        working-directory: ./app/warehouse-ui
        run: npm run build

      - name: Run FE tests
        working-directory: ./app/warehouse-ui
        run: npm run test

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install BE dependencies
        working-directory: ./app/warehouse-api
        run: npm install

      - name: Build BE
        working-directory: ./app/warehouse-api
        run: npm run build

      # - name: Run BE tests
      #   working-directory: ./app/warehouse-api
      #   run: npm run test
