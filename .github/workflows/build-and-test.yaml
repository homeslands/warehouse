name: build-and-test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          frontend=false
          backend=false
          if files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
            printf 'Changed files:\n%s\n' "$files"
            if grep -Eq '^(app/warehouse-ui/|\.github/docker/warehouse-ui/)' <<<"$files"; then
              frontend=true
            fi
            if grep -Eq '^(app/warehouse-api/|\.github/docker/warehouse-api/)' <<<"$files"; then
              backend=true
            fi
            if grep -Fxq '.github/workflows/build-and-test.yaml' <<<"$files"; then
              frontend=true
              backend=true
            fi
          else
            echo "::warning::git diff failed; running all build-and-test jobs"
            frontend=true
            backend=true
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend backend=$backend"

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FE dependencies
        working-directory: ./app/warehouse-ui
        run: npm install

      - name: Build FE
        working-directory: ./app/warehouse-ui
        run: npm run build

      - name: Run FE tests
        working-directory: ./app/warehouse-ui
        run: npm run test

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install BE dependencies
        working-directory: ./app/warehouse-api
        run: npm install

      - name: Build BE
        working-directory: ./app/warehouse-api
        run: npm run build

      # - name: Run BE tests
      #   working-directory: ./app/warehouse-api
      #   run: npm run test
