name: build-and-test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          frontend=false
          backend=false
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] &&
            files="$(set -o pipefail; git -c core.quotePath=false diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n')"; then
            echo "Changed files: $(grep -c . <<<"$files" || true)"
            stop_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop_token"
            printf '%s\n' "$files"
            echo "::$stop_token::"
            if grep -Eq '^(app/warehouse-ui/|\.github/docker/warehouse-ui/)' <<<"$files"; then
              frontend=true
            fi
            if grep -Eq '^(app/warehouse-api/|\.github/docker/warehouse-api/)' <<<"$files"; then
              backend=true
            fi
            if grep -Fxq '.github/workflows/build-and-test.yaml' <<<"$files"; then
              frontend=true
              backend=true
            fi
          else
            echo "::warning::Could not compute changed files; running all build-and-test jobs"
            frontend=true
            backend=true
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend backend=$backend"

  build-frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FE dependencies
        working-directory: ./app/warehouse-ui
        run: npm install

      - name: Build FE
        working-directory: ./app/warehouse-ui
        run: npm run build

      - name: Run FE tests
        working-directory: ./app/warehouse-ui
        run: npm run test

  build-backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Cùng bản Node với dev (`.nvmrc` = 24, `engines: >=24`), không hard-code.
          node-version-file: app/warehouse-api/.nvmrc

      - name: Install BE dependencies
        working-directory: ./app/warehouse-api
        run: npm install

      - name: Build BE
        working-directory: ./app/warehouse-api
        run: npm run build

      # Unit test thuần (không cần MySQL/Redis). E2E harness (`test:e2e`) cần target DB test riêng
      # nên KHÔNG chạy ở đây — xem app/warehouse-api/test/README-e2e.md.
      - name: Run BE unit tests
        working-directory: ./app/warehouse-api
        run: npm test -- --ci
