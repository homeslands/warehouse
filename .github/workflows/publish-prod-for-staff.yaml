name: publish-prod-for-staff

on:
  push:
    branches:
      - prod-for-staff

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: homeslands

jobs:
  publish-prod-for-staff:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    environment: prod-for-staff

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # This ensures all tags are fetched

      # Step 2: Set up Docker Buildx (optional for multi-arch support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Copy Environment Configuration
        env:
          GOOGLE_API_CREDENTIALS: ${{ secrets.GOOGLE_API_CREDENTIALS }}
          FE_ENV: ${{ secrets.FE_ENV_PROD_FOR_STAFF }}
          AUTHORITIES: ${{ secrets.AUTHORITIES }}
        run: |
          mkdir -p app/warehouse-api/public/json
          echo "$GOOGLE_API_CREDENTIALS" > app/warehouse-api/public/json/credentials.json
          echo "$AUTHORITIES" > app/warehouse-api/public/json/authorities.json
          echo "$FE_ENV" > app/warehouse-ui/.env

      # Step 3: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push warehouse-api image
        uses: docker/build-push-action@v4
        with:
          context: ./app/warehouse-api
          file: ./.build/warehouse-api/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/warehouse-api:prod-for-staff
          labels: ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/warehouse-api
          push: true

      - name: Build and push warehouse-ui image
        uses: docker/build-push-action@v4
        with:
          context: ./app/warehouse-ui
          file: ./.build/warehouse-ui/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/warehouse-ui:prod-for-staff
          labels: ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/warehouse-ui
          push: true
