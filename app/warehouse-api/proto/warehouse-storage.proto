syntax = "proto3";
package warehouse.storage.v1;
import "google/protobuf/struct.proto";
import "google/protobuf/field_mask.proto";

// Target design contract only. No service is claimed to be running.
// Gateway and Storage authenticate each other with mTLS. Caller JWT is sent in
// authorization metadata; Storage independently checks session, authority and scope.
// No userId/role/scope supplied in message fields is trusted as identity.
// Decimal money/quantity use strings. Required/enums/date/cross-field rules follow
// OpenAPI + business-rules.md and MUST be validated by Storage, not only Gateway.
message CommandContext {
  string trace_id = 1;
  string idempotency_key = 2;
  optional int64 expected_version = 3;
}
message ResponseMeta { string trace_id = 1; string timestamp = 2; }
message FileUploadHeader {
  CommandContext context = 1; string original_name = 2; string purpose = 3;
  string warehouse_id = 4; string claimed_mime_type = 5;
}
message FileUploadChunk {
  oneof part { FileUploadHeader header = 1; bytes chunk = 2; }
}
message UploadFileResponse { ResponseMeta meta = 1; FileMetadata result = 2; }
// Header must be first and unique; chunks <=64KiB; count bytes and enforce purpose
// limit before storing/attaching. Cancellation/error removes only uncommitted temp object.
message FieldError {
  optional string field = 1 [json_name = "field"];
  optional string error_key = 2 [json_name = "errorKey"];
  optional string message = 3 [json_name = "message"];
}

message Error {
  optional int64 status_code = 1 [json_name = "statusCode"];
  optional int64 code = 2 [json_name = "code"];
  optional string error_key = 3 [json_name = "errorKey"];
  optional string message = 4 [json_name = "message"];
  optional string trace_id = 5 [json_name = "traceId"];
  optional string timestamp = 6 [json_name = "timestamp"];
  repeated FieldError errors = 7 [json_name = "errors"];
}

message VersionCommand {
  optional int64 version = 1 [json_name = "version"];
  optional string reason = 2 [json_name = "reason"];
}

message ActionResult {
  optional string id = 1 [json_name = "id"];
